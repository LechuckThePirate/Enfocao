<!doctype html>
<!-- The window's backgrounds, rendered with headless Chrome (see images/art/render.ps1):
       backdrop.html?b=banner  -> Media/Banner.png    1024x128, the header of each view
       backdrop.html?b=window  -> Media/Window.png    512x512, the window's background (stretched) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body><div id="out"></div>
<script>
const kind = new URLSearchParams(location.search).get("b") || "banner";
const banner = `
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="128" viewBox="0 0 1024 128">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3c1233"/><stop offset="0.45" stop-color="#230c1f"/><stop offset="1" stop-color="#0d070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="9%" cy="50%" r="30%">
      <stop offset="0" stop-color="#d94fb0" stop-opacity="0.45"/><stop offset="1" stop-color="#d94fb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="none"/><path d="M0 0 V14" stroke="#ffffff" stroke-opacity="0.035" stroke-width="5"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#d94fb0" stop-opacity="0.9"/><stop offset="0.6" stop-color="#d9b25a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9b25a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="128" fill="url(#g)"/>
  <rect width="1024" height="128" fill="url(#diag)"/>
  <rect width="1024" height="128" fill="url(#glow)"/>
  <rect width="1024" height="64" fill="url(#shine)"/>
  <g fill="#ffffff">
    ${Array.from({length: 60}, (_, i) => {
      const x = (i * 173) % 1024, y = (i * 97) % 120 + 4, r = (i % 3) * 0.6 + 0.6, o = 0.05 + (i % 5) * 0.03;
      return `<circle cx="${x}" cy="${y}" r="${r}" opacity="${o}"/>`; }).join("")}
  </g>
  <rect x="0" y="122" width="1024" height="3" fill="url(#line)"/>
  <path d="M0 120 L1024 120" stroke="#000" stroke-opacity="0.4" stroke-width="1"/>
  <g fill="#d9b25a" opacity="0.8"><path d="M168 123.5 l5 -5 5 5 -5 5z"/><path d="M188 123.5 l3 -3 3 3 -3 3z"/></g>
</svg>`;
const win = `
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="v" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2b1027"/><stop offset="0.6" stop-color="#170a14"/><stop offset="1" stop-color="#090508"/>
    </radialGradient>
    <pattern id="lattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 0 L32 16 L16 32 L0 16 Z" fill="none" stroke="#d94fb0" stroke-opacity="0.045" stroke-width="1"/>
      <circle cx="16" cy="16" r="1" fill="#d94fb0" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="corner" cx="100%" cy="0%" r="60%">
      <stop offset="0" stop-color="#d9b25a" stop-opacity="0.07"/><stop offset="1" stop-color="#d9b25a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#v)"/>
  <rect width="512" height="512" fill="url(#lattice)"/>
  <rect width="512" height="512" fill="url(#corner)"/>
</svg>`;
document.getElementById("out").innerHTML = kind === "window" ? win : banner;
</script></body></html>
